spring:
  application:
    name: agentic-order-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.example.agenticorderservice: INFO
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
