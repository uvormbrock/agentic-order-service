spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: agentic-order-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.example.agenticorderservice: INFO
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

# API documentation is opt-in for the isolated demo, not the default/local runtime.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  product-images:
    storage-directory: ${PRODUCT_IMAGE_STORAGE_DIRECTORY:./var/product-images}
    writes-enabled: ${PRODUCT_IMAGE_WRITES_ENABLED:false}
